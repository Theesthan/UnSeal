[project]
name = "unseal"
version = "0.1.0"
description = "UnSeal API: RTI applications, deadlines and appeals"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "apscheduler>=3.10,<4",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "openai>=3.37.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.16.1",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "python-telegram-bot>=21",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unseal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the real BharatCode API (opt-in: pytest -m live)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
