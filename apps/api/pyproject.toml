[project]
name = "unseal"
version = "0.1.0"
description = "UnSeal API: RTI applications, deadlines and appeals"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.37.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.16.1",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unseal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the real BharatCode API (opt-in: pytest -m live)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
